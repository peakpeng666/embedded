<g id="title" data-pptx-bounds="64 42 1152 112" fill="#132E3B"><text x="64" y="64" font-size="16" fill="#167D8D">01 / 初始化</text><text x="64" y="123" font-size="40" font-weight="bold">初始化：启动流程与时基依赖</text></g>
<g id="startup" data-pptx-bounds="64 177 1152 77"><rect x="64" y="177" width="1152" height="77" fill="#E8EEEB" /><text x="88" y="224" fill="#132E3B">复位</text><text x="185" y="224" font-family="Consolas" fill="#132E3B">SystemInit()</text><text x="432" y="224" fill="#132E3B">C 运行时初始化</text><text x="730" y="224" font-family="Consolas" fill="#132E3B">main()</text><line x1="149" y1="215" x2="174" y2="215" stroke="#167D8D" stroke-width="2" marker-end="url(#arrow)" /><line x1="370" y1="215" x2="418" y2="215" stroke="#167D8D" stroke-width="2" marker-end="url(#arrow)" /><line x1="650" y1="215" x2="713" y2="215" stroke="#167D8D" stroke-width="2" marker-end="url(#arrow)" /><text x="900" y="222" font-size="20" fill="#61747B">两份工程共同的入口</text></g>
<g id="standard-init" data-pptx-bounds="64 290 513 247" fill="#132E3B"><text x="64" y="319" font-size="28" font-weight="bold" fill="#D66A35">标准库 · main 之前</text><text x="64" y="380" font-family="Consolas"><tspan x="64" dy="0">SystemInit()</tspan><tspan x="64" dy="47">  → SetSysClock()</tspan><tspan x="64" dy="47">  → HSE + PLL + 总线分频</tspan></text><text x="64" y="526" font-size="20" fill="#61747B">进入 main 时，主时钟配置已经完成。</text></g>
<g id="hal-init" data-pptx-bounds="617 290 599 247"><text x="641" y="319" font-size="28" font-weight="bold" fill="#167D8D">HAL · main 中</text><rect x="617" y="341" width="599" height="158" rx="8" fill="#132E3B" /><text x="641" y="371" font-size="16" fill="#AABDBF">main() / HAL 调用顺序</text><text x="641" y="411" font-family="Consolas" font-size="20" fill="#F5F6F2"><tspan x="641" dy="0"><tspan fill="#73D5D4">HAL_Init</tspan>();</tspan><tspan x="641" dy="32"><tspan fill="#73D5D4">SystemClock_Config</tspan>();</tspan><tspan x="641" dy="32"><tspan fill="#73D5D4">MX_GPIO_Init</tspan>();</tspan></text><text x="641" y="526" font-size="20" fill="#61747B">HSI 16 MHz 建立时基 → PLL 168 MHz。</text></g>
<g id="tick-refresh" data-pptx-bounds="64 557 1152 81" fill="#1D3440"><line x1="64" y1="557" x2="1216" y2="557" stroke="#C9D5D2" /><text x="64" y="590" font-size="20"><tspan x="64" dy="0">初始 1 ms 时基供 HSE 就绪检测、PLL 锁定等待中的超时判断使用。</tspan><tspan x="64" dy="33">切换至 168 MHz 后：更新 SystemCoreClock → 再次调用 HAL_InitTick()。</tspan></text></g>
