<g id="title" data-pptx-bounds="64 42 1152 112" fill="#132E3B"><text x="64" y="64" font-size="16" fill="#167D8D">04 / 应用 · HAL</text><text x="64" y="123" font-size="40" font-weight="bold">HAL_Delay：时间差判定与阻塞等待</text></g>
<g id="hal-delay-source" data-pptx-bounds="64 178 726 452"><rect x="64" y="178" width="726" height="452" rx="8" fill="#132E3B"/><text x="86" y="209" font-size="16" fill="#AABDBF">stm32f4xx_hal.c</text><text x="86" y="250" font-family="Consolas" font-size="20" fill="#F5F6F2"><tspan x="86" dy="0"><tspan fill="#73D5D4">__weak void</tspan> HAL_Delay(uint32_t Delay)</tspan><tspan x="86" dy="27">{</tspan><tspan x="86" dy="27">  <tspan fill="#73D5D4">uint32_t</tspan> tickstart = HAL_GetTick();</tspan><tspan x="86" dy="27">  <tspan fill="#73D5D4">uint32_t</tspan> wait = Delay;</tspan><tspan x="86" dy="27">  <tspan fill="#73D5D4">if</tspan> (wait &lt; HAL_MAX_DELAY)</tspan><tspan x="86" dy="27">  {</tspan><tspan x="86" dy="27">    wait += (uint32_t)(uwTickFreq);</tspan><tspan x="86" dy="27">  }</tspan><tspan x="86" dy="27">  <tspan fill="#73D5D4">while</tspan>((HAL_GetTick() - tickstart) &lt; wait)</tspan><tspan x="86" dy="27">  {</tspan><tspan x="86" dy="27">  }</tspan><tspan x="86" dy="27">}</tspan></text><text x="86" y="607" font-size="16" fill="#AABDBF">wait 增加一个时基周期，补偿调用起点处于节拍末尾的情况。</text></g>
<g id="hal-delay-mechanism" data-pptx-bounds="830 178 386 452" fill="#132E3B"><text x="830" y="209" font-size="20" fill="#167D8D">HAL_Delay(1000)</text><text x="830" y="281" font-size="68" font-family="Consolas">1<tspan font-size="28"> s</tspan></text><text x="830" y="329" font-size="20">阻塞等待 · 参数单位 ms</text><line x1="830" y1="354" x2="1216" y2="354" stroke="#C9D5D2"/>
<text x="830" y="395" font-size="20"><tspan x="830" dy="0">① HAL_InitTick：配置时基</tspan><tspan x="830" dy="44">② HAL_IncTick：累计时间</tspan><tspan x="830" dy="44">③ HAL_GetTick：读取毫秒</tspan><tspan x="830" dy="44">④ HAL_Delay：比较经过时间</tspan></text><line x1="830" y1="553" x2="1216" y2="553" stroke="#C9D5D2"/><text x="830" y="588" font-size="20"><tspan x="830" dy="0">SysTick_Handler → HAL_IncTick</tspan><tspan x="830" dy="31" fill="#61747B">经过时间 ≥ wait 时退出轮询。</tspan></text></g>
