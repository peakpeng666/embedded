<g id="pll-code" data-pptx-bounds="64 357 733 267"><rect x="64" y="357" width="733" height="267" rx="8" fill="#132E3B" /><text x="87" y="392" font-size="16" fill="#AABDBF">SystemClock_Config() / PLL 参数</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="87" y="434">RCC_OscInitStruct.PLL.PLLSource = RCC_PLLSOURCE_HSE;</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="87" y="465"><tspan>RCC_OscInitStruct.PLL.PLLM = <tspan fill="#73D5D4">8</tspan>;</tspan></text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="87" y="496"><tspan>RCC_OscInitStruct.PLL.PLLN = <tspan fill="#73D5D4">336</tspan>;</tspan></text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="87" y="527">RCC_OscInitStruct.PLL.PLLP = RCC_PLLP_DIV2;</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="87" y="558"><tspan>RCC_OscInitStruct.PLL.PLLQ = <tspan fill="#F3AD80">4</tspan>;</tspan></text><text x="87" y="588" font-size="16" fill="#AABDBF">STD：25 ÷ 25 × 336 ÷ 2 = 168 MHz，原例程 Q = 7。</text><text x="87" y="614" font-size="16" fill="#F3AD80">板上晶振 8 MHz：实际 53.76 MHz，SystemCoreClock 仍为 168 MHz，M 需改 25→8。</text></g>
<g id="q-branch" data-pptx-bounds="837 357 379 267" fill="#132E3B"><text x="837" y="387" font-size="28" font-weight="bold">PLLQ 输出频率</text><text x="837" y="435" font-size="28" fill="#D66A35">84 MHz ＞ 75 MHz</text><text font-size="20" x="837" y="471">Q = 4：336 ÷ 4 = 84 MHz</text><text font-size="20" x="837" y="499">超过数据手册规定的输出上限。</text><text font-size="18" x="837" y="527">USB OTG FS、SDIO、RNG 使用 PLL48CK，</text><text font-size="18" x="837" y="553">例程未启用，越限不影响运行。</text><line x1="837" y1="572" x2="1216" y2="572" stroke="#C9D5D2" /><text x="837" y="594" font-size="20" fill="#167D8D">本组参数：Q = 7 → 48 MHz</text><text x="837" y="616" font-size="16" fill="#61747B">DS8626 Rev 12，表 36：最大 75 MHz</text></g>
