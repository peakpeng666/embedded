<g id="hal-delay-source" data-pptx-bounds="64 178 726 452"><rect x="64" y="178" width="726" height="452" rx="8" fill="#132E3B" /><text x="86" y="209" font-size="16" fill="#AABDBF">stm32f4xx_hal.c</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="250"><tspan><tspan fill="#73D5D4">__weak void</tspan> HAL_Delay(uint32_t Delay)</tspan></text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="277">{</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="304"><tspan>  <tspan fill="#73D5D4">uint32_t</tspan> tickstart = HAL_GetTick();</tspan></text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="331"><tspan>  <tspan fill="#73D5D4">uint32_t</tspan> wait = Delay;</tspan></text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="358"><tspan>  <tspan fill="#73D5D4">if</tspan> (wait &lt; HAL_MAX_DELAY)</tspan></text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="385">  {</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="412">    wait += (uint32_t)(uwTickFreq);</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="439">  }</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="466"><tspan>  <tspan fill="#73D5D4">while</tspan>((HAL_GetTick() - tickstart) &lt; wait)</tspan></text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="493">  {</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="520">  }</text><text font-size="20" font-family="Consolas" fill="#F5F6F2" x="86" y="547">}</text><text x="86" y="607" font-size="16" fill="#AABDBF">wait 增加一个时基周期，补偿调用起点处于节拍末尾的情况。</text></g>
