<g id="delay-code" data-pptx-bounds="64 178 677 377"><rect x="64" y="178" width="677" height="377" rx="8" fill="#132E3B" /><text x="86" y="210" font-size="16" fill="#AABDBF">Usermain.c</text><text x="86" y="251" font-family="Consolas" font-size="20" fill="#F5F6F2"><tspan x="86" dy="0"><tspan fill="#73D5D4">void</tspan> Delay(__IO uint32_t nTime)</tspan><tspan x="86" dy="25">{</tspan><tspan x="86" dy="25">  uwTimingDelay = nTime;</tspan><tspan x="86" dy="25">  <tspan fill="#73D5D4">while</tspan>(uwTimingDelay != 0);</tspan><tspan x="86" dy="25">}</tspan><tspan x="86" dy="35"><tspan fill="#73D5D4">void</tspan> TimingDelay_Decrement(void)</tspan><tspan x="86" dy="25">{</tspan><tspan x="86" dy="25">  <tspan fill="#73D5D4">if</tspan> (uwTimingDelay != 0x00)</tspan><tspan x="86" dy="25">  {</tspan><tspan x="86" dy="25">    uwTimingDelay--;</tspan><tspan x="86" dy="25">  }</tspan><tspan x="86" dy="25">}</tspan></text></g>
<g id="delay-flow" data-pptx-bounds="781 178 435 377" fill="#132E3B"><text x="781" y="208" font-size="20" fill="#D66A35">Delay(10) · 主循环</text><rect x="826" y="238" width="310" height="56" rx="8" fill="#E8EEEB" /><text x="981" y="273" font-family="Consolas" font-size="20" text-anchor="middle">uwTimingDelay = 10</text><line x1="981" y1="294" x2="981" y2="345" stroke="#167D8D" stroke-width="2" marker-end="url(#arrow)" />
<g id="delay-condition" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartDecision" data-pptx-frame="866 348 230 108" fill="#E8F4F1" stroke="#167D8D" stroke-width="2"><path d="M 866 402 L 981 348 L 1096 402 L 981 456 Z" /></g>
<text x="981" y="409" text-anchor="middle" font-size="20">计数 ≠ 0？</text><line x1="1096" y1="402" x2="1182" y2="402" stroke="#167D8D" stroke-width="2" /><line x1="1182" y1="402" x2="1182" y2="331" stroke="#167D8D" stroke-width="2" /><line x1="1182" y1="331" x2="981" y2="331" stroke="#167D8D" stroke-width="2" /><text x="1040" y="320" font-size="16" fill="#61747B">是：继续检查</text><line x1="981" y1="456" x2="981" y2="499" stroke="#167D8D" stroke-width="2" marker-end="url(#arrow)" /><text x="999" y="484" font-size="16" fill="#61747B">否</text><rect x="866" y="502" width="230" height="49" rx="8" fill="#167D8D" /><text x="981" y="534" font-size="20" fill="#F5F6F2" text-anchor="middle">返回主循环</text></g>
<g id="interrupt" data-pptx-bounds="64 574 1152 65" fill="#132E3B" font-size="20"><text x="64" y="596">SysTick 每 10 ms 调用递减函数；Delay(10) ≈ 100 ms，Delay(1) ≈ 10 ms。板上 8 MHz 晶振时均为 3.1 倍。</text><text x="64" y="629" fill="#D66A35">__IO = volatile：保留共享计数的实际访问；循环阻塞当前任务，中断仍可执行。</text></g>
