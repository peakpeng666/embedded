<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei" font-size="24" data-pptx-page-role="content">
<rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F5F6F2"/>
<g id="title" data-pptx-bounds="64 42 1152 112" fill="#132E3B"><text x="64" y="64" font-size="16" fill="#167D8D">原理与应用</text><text x="64" y="123" font-size="40" font-weight="bold">时钟域分工与外设门控</text></g>
<g id="sources" data-pptx-bounds="64 180 536 164" fill="#132E3B"><text x="64" y="211" font-size="28" font-weight="bold">高速源与 PLL</text><line x1="64" y1="231" x2="600" y2="231" stroke="#167D8D" stroke-width="3"/><text x="64" y="269" font-size="20"><tspan x="64" dy="0">HSI：内部 16 MHz RC，可用于启动与后备。</tspan><tspan x="64" dy="34">HSE：外部晶振，提供主时钟参考。</tspan><tspan x="64" dy="34">PLL：对参考时钟分频、倍频，再分配输出。</tspan></text></g>
<g id="bus-roles" data-pptx-bounds="664 180 552 164" fill="#132E3B"><text x="664" y="211" font-size="28" font-weight="bold">系统与总线时钟</text><line x1="664" y1="231" x2="1216" y2="231" stroke="#167D8D" stroke-width="3"/><text x="664" y="269" font-size="20"><tspan x="664" dy="0">SYSCLK：选定的系统时钟源输出。</tspan><tspan x="664" dy="34">HCLK：CPU、AHB 总线的节拍。</tspan><tspan x="664" dy="34">PCLK1 / PCLK2：APB 外设的节拍。</tspan></text></g>
<g id="low-speed" data-pptx-bounds="64 380 536 126" fill="#132E3B"><text x="64" y="413" font-size="28" font-weight="bold">低速时钟</text><text x="64" y="460" font-size="20"><tspan x="64" dy="0">LSE：外部 32.768 kHz，适合 RTC 走时。</tspan><tspan x="64" dy="34">LSI：内部约 32 kHz，供独立看门狗等使用。</tspan></text></g>
<g id="timebase" data-pptx-bounds="664 380 552 126" fill="#132E3B"><text x="664" y="413" font-size="28" font-weight="bold">软件计时与硬件定时</text><text x="664" y="460" font-size="20"><tspan x="664" dy="0">SysTick：软件时基、超时判断、短时等待。</tspan><tspan x="664" dy="34">TIM / PWM：周期中断、精确定时与波形输出。</tspan></text></g>
<g id="peripheral-gate" data-pptx-bounds="64 548 1152 85"><rect x="64" y="548" width="1152" height="85" rx="8" fill="#132E3B"/><text x="86" y="582" font-family="Consolas" font-size="20" fill="#73D5D4">__HAL_RCC_GPIOE_CLK_ENABLE();</text><text x="499" y="582" font-size="20" fill="#F5F6F2">使用外设前，先打开对应的时钟门控。</text><text x="86" y="615" font-size="16" fill="#AABDBF">gpio.c · 未使用的外设可关闭时钟，以降低功耗。</text></g>
<g id="footer" data-pptx-bounds="64 652 1152 29" data-pptx-role="footer" font-size="16" fill="#61747B"><text x="64" y="675">依据：RM0090，STM32F405/407 RCC、RTC、TIM；PM0214 SysTick；HAL gpio.c</text><text x="1216" y="675" text-anchor="end">11 / 12</text></g>
</svg>
