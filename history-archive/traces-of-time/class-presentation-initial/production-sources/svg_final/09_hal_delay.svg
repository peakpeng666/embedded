<g id="title" data-pptx-bounds="64 42 1152 112" fill="#132E3B"><text x="64" y="64" font-size="16" fill="#167D8D">04 / 应用 · HAL</text><text x="64" y="123" font-size="40" font-weight="bold">HAL_Delay：等累计时间走够</text></g>
<g id="hal-delay-source" data-pptx-bounds="64 178 726 452"><rect x="64" y="178" width="726" height="452" rx="8" fill="#132E3B" /><text x="86" y="209" font-size="16" fill="#AABDBF">stm32f4xx_hal.c:389–403</text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="250"><tspan><tspan fill="#73D5D4">__weak void</tspan> HAL_Delay(uint32_t Delay)</tspan></text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="277">{</text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="304"><tspan>  <tspan fill="#73D5D4">uint32_t</tspan> tickstart = HAL_GetTick();</tspan></text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="331"><tspan>  <tspan fill="#73D5D4">uint32_t</tspan> wait = Delay;</tspan></text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="358"><tspan>  <tspan fill="#73D5D4">if</tspan> (wait &lt; HAL_MAX_DELAY)</tspan></text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="385">  {</text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="412">    wait += (uint32_t)(uwTickFreq);</text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="439">  }</text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="466"><tspan>  <tspan fill="#73D5D4">while</tspan>((HAL_GetTick() - tickstart) &lt; wait)</tspan></text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="493">  {</text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="520">  }</text><text font-size="20" fill="#F5F6F2" font-family="Consolas" x="86" y="547">}</text><text x="86" y="607" font-size="16" fill="#AABDBF">默认多等待一个滴答，保证实际等待不少于请求时长。</text></g>
<g id="hal-delay-mechanism" data-pptx-bounds="830 178 386 452" fill="#132E3B"><text x="830" y="209" font-size="20" fill="#167D8D">HAL_Delay(1000)</text><text x="830" y="281" font-size="68" font-family="Consolas">1<tspan font-size="28"> 秒左右</tspan></text><text x="830" y="329" font-size="20">参数单位：毫秒</text><line x1="830" y1="354" x2="1216" y2="354" stroke="#C9D5D2" />
<text font-size="20" x="830" y="395">① HAL_InitTick：配置时基</text><text font-size="20" x="830" y="439">② HAL_IncTick：累计时间</text><text font-size="20" x="830" y="483">③ HAL_GetTick：读取毫秒</text><text font-size="20" x="830" y="527">④ HAL_Delay：比较经过时间</text><line x1="830" y1="553" x2="1216" y2="553" stroke="#C9D5D2" /><text font-size="20" x="830" y="588">SysTick_Handler → HAL_IncTick</text><text font-size="20" x="830" y="619" fill="#61747B">经过时间 ≥ wait 时返回。</text></g>
