<g id="title" data-pptx-bounds="64 42 1152 112" fill="#132E3B"><text x="64" y="64" font-size="16" fill="#167D8D">02 → 04 / 设置滴答，准备应用</text><text x="64" y="123" font-size="40" font-weight="bold">设置 SysTick：一拍究竟多长</text></g>
<g id="counter-principle" data-pptx-bounds="64 177 1152 95"><text x="64" y="213" font-size="28" fill="#132E3B">24 位递减计数器：装载 → 递减 → 到零中断 → 重装</text><text x="64" y="259" font-family="Consolas" font-size="28" fill="#167D8D">T = (LOAD + 1) / fSysTick</text><text x="741" y="259" font-size="20" fill="#61747B">两份例程均通过 CMSIS 选择 HCLK</text></g>
<g id="std-period" data-pptx-bounds="64 302 545 184" fill="#132E3B"><line x1="64" y1="302" x2="609" y2="302" stroke="#D66A35" stroke-width="4" /><text x="64" y="346" fill="#D66A35">标准库 · HCLK / 100</text><text x="64" y="426" font-size="68" font-family="Consolas">10<tspan font-size="28"> ms</tspan></text><text x="64" y="477" font-size="20">ticks = 1 680 000　 LOAD = 1 679 999</text></g>
<g id="hal-period" data-pptx-bounds="671 302 545 184" fill="#132E3B"><line x1="671" y1="302" x2="1216" y2="302" stroke="#167D8D" stroke-width="4" /><text x="671" y="346" fill="#167D8D">HAL 默认 · HCLK / 1000</text><text x="671" y="426" font-size="68" font-family="Consolas">1<tspan font-size="28"> ms</tspan></text><text x="671" y="477" font-size="20">ticks = 168 000　 LOAD = 167 999</text></g>
<g id="systick-code" data-pptx-bounds="64 515 1152 112"><rect x="64" y="515" width="1152" height="112" rx="8" fill="#132E3B" /><text x="86" y="548" font-family="Consolas" font-size="20" fill="#F5F6F2"><tspan x="86" dy="0">SysTick_Config(RCC_Clocks.HCLK_Frequency / 100);</tspan><tspan x="86" dy="32">HAL_SYSTICK_Config(SystemCoreClock / (1000U / uwTickFreq))</tspan></text><text x="86" y="609" font-size="16" fill="#AABDBF">原调用表达式；HAL 默认 uwTickFreq = 1。CMSIS 写入 LOAD = ticks − 1；改 HCLK 后需重新配置滴答。</text></g>
