<g id="title" data-pptx-bounds="64 42 1152 112" fill="#132E3B"><text x="64" y="64" font-size="16" fill="#167D8D">04 / 应用 · 观察原例程</text><text x="64" y="123" font-size="40" font-weight="bold">应用：一段延时，怎样变成闪烁</text></g>
<g id="std-led" data-pptx-bounds="64 180 552 367" fill="#132E3B"><text x="64" y="213" font-size="28" font-weight="bold" fill="#D66A35">标准库 · 每 5 次循环翻转</text><rect x="64" y="242" width="552" height="165" rx="8" /><text x="85" y="278" font-family="Consolas" font-size="20" fill="#F5F6F2"><tspan x="85" dy="0">Delay(10);</tspan><tspan x="85" dy="32">if(Index%5==0)</tspan><tspan x="85" dy="32">  GPIO_ToggleBits(GPIOE, LED2_Pin);</tspan></text><text x="85" y="386" font-size="16" fill="#AABDBF">Usermain.c:62–65；Index 在循环末尾递增。</text><text x="64" y="459" font-size="28">翻转间隔 ≈ <tspan fill="#D66A35" font-weight="bold">500 ms</tspan></text><text x="64" y="507" font-size="20"><tspan x="64" dy="0">流水灯约每 100 ms 移到下一位。</tspan><tspan x="64" dy="32">稳定运行后，完整亮灭周期约 1 s。</tspan></text></g>
<g id="hal-led" data-pptx-bounds="664 180 552 367" fill="#132E3B"><text x="664" y="213" font-size="28" font-weight="bold" fill="#167D8D">HAL · 每次循环翻转</text><rect x="664" y="242" width="552" height="165" rx="8" /><text x="685" y="278" font-family="Consolas" font-size="20" fill="#F5F6F2"><tspan x="685" dy="0">HAL_Delay (1000);</tspan><tspan x="685" dy="64">HAL_GPIO_TogglePin(GPIOE, LED2_Pin);</tspan></text><text x="685" y="386" font-size="16" fill="#AABDBF">main.c:100–102</text><text x="664" y="459" font-size="28">翻转间隔 ≈ <tspan fill="#167D8D" font-weight="bold">1 s</tspan></text><text x="664" y="507" font-size="20"><tspan x="664" dy="0">流水灯约每 1 s 移到下一位。</tspan><tspan x="664" dy="32">完整亮灭周期约 2 s。</tspan></text></g>
<g id="application-takeaway" data-pptx-bounds="64 575 1152 59"><rect x="64" y="575" width="1152" height="59" fill="#E8EEEB" /><text x="85" y="613" font-size="20" fill="#132E3B">一次翻转只完成半个亮灭周期。精确定时用 TIM / PWM；主循环兼顾多项任务时，用 tick 差值安排动作。</text></g>
